<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jalees Nehvi — Graphics • 3D Vision • Digital Humans</title>
  <meta name="description" content="Jalees Nehvi — 3D digital humans and multi-view reconstruction." />

  <style>
    :root{
      --bg: #f7f8fc;
      --panel: rgba(255,255,255,.78);
      --text: rgba(15, 23, 42, .92);
      --muted: rgba(15, 23, 42, .70);
      --faint: rgba(15, 23, 42, .55);
      --line: rgba(15, 23, 42, .14);
      --brand: #6d5efc;
      --brand2:#00b8a9;
      --shadow: 0 18px 50px rgba(2,6,23,.10);
      --radius: 18px;
      --radius2: 14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      --max: 980px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin:0;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(1100px 700px at 12% 8%, rgba(109,94,252,.18), transparent 55%),
        radial-gradient(900px 650px at 78% 10%, rgba(0,184,169,.14), transparent 58%),
        radial-gradient(900px 700px at 40% 92%, rgba(15, 23, 42, .06), transparent 62%),
        var(--bg);
      letter-spacing: .2px;
    }

    a{ color: inherit; text-decoration: none; }
    a:hover{ text-decoration: underline; text-underline-offset: 3px; }

    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    /* Top nav */
    .nav{
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(247,248,252,.82), rgba(247,248,252,.45));
      border-bottom: 1px solid rgba(15,23,42,.08);
    }
    .nav-inner{
      max-width: var(--max);
      margin: 0 auto;
      padding: 14px 18px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 240px;
    }
    .dot{
      width: 10px; height: 10px; border-radius: 50%;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow: 0 0 0 4px rgba(109,94,252,.12);
    }
    .brand strong{ font-weight: 700; }
    .brand span{ color: var(--muted); font-size: 13px; }

    .nav-links{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .nav-links a{
      color: var(--muted);
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
    }
    .nav-links a:hover{
      color: var(--text);
      border-color: rgba(15,23,42,.12);
      background: rgba(255,255,255,.55);
      text-decoration: none;
    }

    /* Layout */
    .hero{
      margin-top: 22px;
      display:grid;
      grid-template-columns: 1.35fr .65fr;
      gap: 16px;
      align-items: stretch;
    }
    .card{
      border: 1px solid rgba(15,23,42,.10);
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .hero-main{
      padding: 24px;
      overflow:hidden;
      position: relative;
    }
    .hero-main:before{
      content:"";
      position:absolute; inset:-2px;
      background:
        radial-gradient(520px 240px at 15% 10%, rgba(109,94,252,.16), transparent 60%),
        radial-gradient(520px 240px at 75% 10%, rgba(0,184,169,.12), transparent 60%);
      opacity:.95;
      pointer-events:none;
    }
    .hero-main > *{ position: relative; }

    .kicker{
      font-family: var(--mono);
      color: var(--faint);
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1{
      margin: 10px 0 10px;
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.12;
    }
    .subtitle{
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
      max-width: 75ch;
    }

    .chips{
      display:flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 0;
    }
    .chip{
      font-size: 13px;
      color: rgba(15, 23, 42, .78);
      border: 1px solid rgba(15, 23, 42, .12);
      background: rgba(255,255,255,.55);
      padding: 8px 10px;
      border-radius: 999px;
    }

    /* Sidebar */
    .hero-side{
      padding: 18px;
      display:flex;
      flex-direction: column;
      gap: 12px;
    }

    .avatar{
      display:flex;
      gap: 12px;
      align-items:center;
      padding: 14px;
      border-radius: var(--radius2);
      border: 1px solid rgba(15,23,42,.10);
      background: rgba(255,255,255,.55);
    }
    .pfp{
      width: 52px; height: 52px; border-radius: 16px;
      border: 1px solid rgba(15,23,42,.12);
      background:
        radial-gradient(circle at 30% 30%, rgba(109,94,252,.26), transparent 60%),
        radial-gradient(circle at 70% 60%, rgba(0,184,169,.18), transparent 60%),
        rgba(255,255,255,.85);
      display:grid; place-items:center;
      font-weight: 750;
      letter-spacing: .02em;
      color: rgba(15,23,42,.85);
    }
    .who strong{ display:block; font-size: 15px; }
    .who span{ display:block; color: var(--muted); font-size: 13px; margin-top: 2px; }

    .mini{
      padding: 14px;
      border-radius: var(--radius2);
      border: 1px solid rgba(15,23,42,.10);
      background: rgba(255,255,255,.55);
    }
    .mini h3{
      margin:0 0 8px;
      font-size: 13px;
      letter-spacing: .10em;
      text-transform: uppercase;
      color: var(--faint);
      font-family: var(--mono);
    }
    .mini p{
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    /* Contact icons */
    .icons{
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .iconbtn{
      display:inline-flex;
      align-items:center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 12px;
      border: 1px solid rgba(15,23,42,.10);
      background: rgba(255,255,255,.75);
      color: rgba(15,23,42,.88);
      font-size: 14px;
      text-decoration: none;
    }
    .iconbtn:hover{ background: rgba(255,255,255,.92); text-decoration:none; }
    .iconbtn svg{ width: 16px; height: 16px; opacity:.92; }

    /* Sections */
    section{ margin-top: 18px; }
    .section-card{
      padding: 18px;
      border-radius: var(--radius);
      border: 1px solid rgba(15,23,42,.10);
      background: rgba(255,255,255,.55);
      box-shadow: 0 10px 30px rgba(2,6,23,.06);
    }
    .section-head{
      display:flex; align-items: baseline; justify-content: space-between; gap: 12px;
      margin-bottom: 12px;
    }
    .section-head h2{
      margin:0;
      font-size: 18px;
      letter-spacing: .02em;
    }

    /* Publications (detailed) */
    .pubs{
      display:flex;
      flex-direction: column;
      gap: 12px;
    }
    .pub{
      border: 1px solid rgba(15,23,42,.10);
      background: rgba(255,255,255,.78);
      border-radius: 14px;
      padding: 14px;
    }
    .pub .title{
      font-weight: 760;
      margin: 0 0 6px;
      line-height: 1.3;
    }
    .pub .authors{
      margin: 0 0 2px;
      color: rgba(15,23,42,.78);
      font-size: 14px;
      line-height: 1.5;
    }
